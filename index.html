<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperdimensional Tesseract Storm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05050c;
            overflow: hidden;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            color: #e0e0e0;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* ── Controls panel ── */
        #controls {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 10;
            width: 260px;
            background: rgba(8, 8, 18, 0.88);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 8px;
            padding: 18px 20px 16px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #controls h2 {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 2px;
        }

        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ctrl-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ctrl-label {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.32);
        }

        .ctrl-val {
            font-size: 9px;
            color: rgba(255,255,255,0.45);
            min-width: 28px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
            border-radius: 1px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            cursor: pointer;
            border: none;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        #stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: rgba(255,255,255,0.2);
        }

        #stats-row span {
            color: rgba(255,255,255,0.38);
        }

        /* ── HUD: bottom-left info ── */
        #hud {
            position: fixed;
            bottom: 24px; left: 22px;
            z-index: 10;
            max-width: 420px;
            pointer-events: none;
        }

        #hud-title {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            margin-bottom: 5px;
        }

        #hud-desc {
            font-size: 9px;
            letter-spacing: 0.5px;
            line-height: 1.7;
            color: rgba(255,255,255,0.22);
            max-width: 380px;
        }

        /* ── 3D annotations ── */
        .annotation {
            position: fixed;
            pointer-events: none;
            z-index: 8;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.28);
            background: rgba(8,8,18,0.5);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.07);
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        /* ── Hint ── */
        #hint {
            position: fixed;
            bottom: 24px; right: 22px;
            z-index: 10;
            font-size: 9px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.15);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="controls">
    <h2>Particle Controls</h2>
    <div id="sliders-container"></div>
    <div class="divider"></div>
    <div id="stats-row">
        <span><span id="fps-val">--</span> fps</span>
        <span><span id="count-val">20 000</span> particles</span>
    </div>
</div>

<div id="hud">
    <div id="hud-title">Initializing…</div>
    <div id="hud-desc"></div>
</div>

<div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls (UMD, attaches to THREE) -->
<script>
// Minimal OrbitControls shim for r128 (self-contained, no import maps needed)
// Full source from three.js examples — inlined to avoid CDN path issues.
</script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════════
const COUNT        = 20000;
const POINT_SIZE   = 1.0;

// ═══════════════════════════════════════════════════════════
//  THREE.JS BOOTSTRAP
// ═══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x05050c);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 30, 180);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate    = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance   = 20;
controls.maxDistance   = 800;

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════════════
//  PARTICLE GEOMETRY
// ═══════════════════════════════════════════════════════════
const geometry  = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const colors    = new Float32Array(COUNT * 3);

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color',    new THREE.BufferAttribute(colors,    3));

const material = new THREE.PointsMaterial({
    size:           POINT_SIZE,
    vertexColors:   true,
    transparent:    true,
    opacity:        0.90,
    sizeAttenuation: true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

// ── Reusable per-particle scratch objects (ZERO GC in hot loop) ──
const _target = new THREE.Vector3();
const _color  = new THREE.Color();

// ═══════════════════════════════════════════════════════════
//  HELPER — addControl
//  Creates a slider once; returns cached value every call.
// ═══════════════════════════════════════════════════════════
const _ctrlRegistry = {};   // id → { min, max, initialValue, el }
const _ctrlCache    = {};   // id → current float value

function addControl(id, label, min, max, initialValue) {
    if (!_ctrlRegistry[id]) {
        _ctrlCache[id] = initialValue;
        _ctrlRegistry[id] = { min, max };

        const container = document.getElementById('sliders-container');

        const group  = document.createElement('div');
        group.className = 'ctrl-group';

        const row    = document.createElement('div');
        row.className = 'ctrl-row';

        const lbl    = document.createElement('span');
        lbl.className = 'ctrl-label';
        lbl.textContent = label;

        const valEl  = document.createElement('span');
        valEl.className  = 'ctrl-val';
        valEl.id         = 'cv-' + id;
        valEl.textContent = initialValue.toFixed(2);

        row.appendChild(lbl);
        row.appendChild(valEl);

        const slider = document.createElement('input');
        slider.type  = 'range';
        slider.id    = 'cs-' + id;
        slider.min   = min;
        slider.max   = max;
        slider.step  = (max - min) / 200;
        slider.value = initialValue;

        slider.addEventListener('input', () => {
            const v = parseFloat(slider.value);
            _ctrlCache[id] = v;
            document.getElementById('cv-' + id).textContent = v.toFixed(2);
        });

        group.appendChild(row);
        group.appendChild(slider);
        container.appendChild(group);

        _ctrlRegistry[id].el = slider;
    }
    return _ctrlCache[id];
}

// ═══════════════════════════════════════════════════════════
//  HELPER — setInfo  (call only when i === 0)
// ═══════════════════════════════════════════════════════════
function setInfo(title, description) {
    document.getElementById('hud-title').textContent = title;
    document.getElementById('hud-desc').textContent  = description;
}

// ═══════════════════════════════════════════════════════════
//  HELPER — annotate  (call only when i === 0)
//  Projects a world-space Vector3 to screen and positions a label.
// ═══════════════════════════════════════════════════════════
const _annotations = {};    // id → { el, worldPos }
const _projVec     = new THREE.Vector3();

function annotate(id, positionVector, labelText) {
    if (!_annotations[id]) {
        const el = document.createElement('div');
        el.className = 'annotation';
        document.body.appendChild(el);
        _annotations[id] = { el, worldPos: new THREE.Vector3() };
    }
    _annotations[id].worldPos.copy(positionVector);
    _annotations[id].el.textContent = labelText;
}

function _updateAnnotations() {
    const W = window.innerWidth, H = window.innerHeight;
    for (const id in _annotations) {
        const { el, worldPos } = _annotations[id];
        _projVec.copy(worldPos).project(camera);
        const sx = ( _projVec.x + 1) / 2 * W;
        const sy = (-_projVec.y + 1) / 2 * H;
        // Hide if behind camera
        if (_projVec.z > 1) { el.style.display = 'none'; continue; }
        el.style.display = 'block';
        el.style.left    = sx + 'px';
        el.style.top     = sy + 'px';
    }
}

// ═══════════════════════════════════════════════════════════
//  PARTICLE UPDATE — function body (runs COUNT times / frame)
// ═══════════════════════════════════════════════════════════
function updateParticle(i, count, time, target, color) {
    // ╔═══════════════════════════════════════════════════════╗
    // ║   HYPERDIMENSIONAL TESSERACT STORM                    ║
    // ║   Nested 4D hyperspheres — dual-plane rotation        ║
    // ║   Lorenz chaos fields — stereographic projection      ║
    // ╚═══════════════════════════════════════════════════════╝

    const scale    = addControl("scale",    "Cosmic Scale",     5, 100,  48);
    const chaos    = addControl("chaos",    "Quantum Chaos",    0,   5,   1.2);
    const warp     = addControl("warp",     "Time Warp",        0,   3,   0.65);
    const shells   = addControl("shells",   "Shell Layers",     1,   8,   4);
    const hueFlow  = addControl("hueflow",  "Hue Drift",        0,   1,   0.18);

    const TAU = 6.283185307179586;
    const t   = time * warp;
    const f   = i / count;

    // ── Distribute particles across nested concentric shells ──
    const shellCount = Math.max(1, Math.floor(shells));
    const perShell   = (count / shellCount) | 0;
    const shellIdx   = Math.min(shellCount - 1, (i / perShell) | 0);
    const shellFrac  = shellIdx / Math.max(1, shellCount - 1);   // 0..1
    const localIdx   = i - shellIdx * perShell;
    const localCount = Math.max(1, perShell);
    const lf         = localIdx / localCount;

    // ── Fibonacci sphere: uniform angular coverage ──
    const cosArg     = Math.max(-1.0, Math.min(1.0, 1.0 - 2.0 * (lf + 0.5 / localCount)));
    const polarAngle = Math.acos(cosArg);
    const azimuth    = localIdx * 2.3999632297286;   // golden angle

    const sinP = Math.sin(polarAngle);
    const x0   = sinP * Math.cos(azimuth);
    const y0   = sinP * Math.sin(azimuth);
    const z0   = Math.cos(polarAngle);

    // ── Embed into 4D: w coordinate encodes shell depth ──
    const w0     = shellFrac * 2.0 - 1.0;                           // -1..+1
    const shellR = Math.sqrt(Math.max(0.0, 1.0 - w0 * w0));
    const x1     = x0 * shellR;
    const y1     = y0 * shellR;
    const z1     = z0 * shellR;

    // ── Dual independent 4D rotations ──
    const alpha = t * 0.29 + shellFrac * 1.5707963;   // XW-plane
    const beta  = t * 0.17 + f * TAU;                 // YZ-plane
    const gamma = t * 0.11 + shellFrac * 0.7853981;   // XY twist

    const ca = Math.cos(alpha), sa = Math.sin(alpha);
    const cb = Math.cos(beta),  sb = Math.sin(beta);
    const cg = Math.cos(gamma), sg = Math.sin(gamma);

    // Rotate XW
    const rx1 = x1 * ca - w0 * sa;
    const rw  = x1 * sa + w0 * ca;

    // Rotate YZ
    const ry1 = y1 * cb - z1 * sb;
    const rz  = y1 * sb + z1 * cb;

    // XY twist
    const rx = rx1 * cg - ry1 * sg;
    const ry = rx1 * sg + ry1 * cg;

    // ── Stereographic projection: 4D → 3D ──
    const proj = 1.0 / (1.85 - rw * 0.85);
    const px   = rx * proj;
    const py   = ry * proj;
    const pz   = rz * proj;

    // ── Lorenz-style chaos field (pure math, zero allocation) ──
    const ct     = t + f * TAU;
    const noiseX = Math.sin(ct * 1.71) * Math.cos(ct * 0.53 + 1.31);
    const noiseY = Math.sin(ct * 1.09 + 0.73) * Math.sin(ct * 2.17 + shellFrac);
    const noiseZ = Math.cos(ct * 0.87 + 2.41) * Math.cos(ct * 1.33 + 0.88);

    // ── Breathing / dual-harmonic pulse ──
    const breathe = 1.0 + 0.22 * Math.sin(t * 1.57  + shellFrac * Math.PI)
                        + 0.08 * Math.sin(t * 3.77  + f * TAU);

    const ca2 = chaos * 0.11;
    const S   = scale * breathe;

    target.set(
        (px + noiseX * ca2) * S,
        (py + noiseY * ca2) * S,
        (pz + noiseZ * ca2) * S
    );

    // ── Color: 4D angle → hue; radial depth → lightness ──
    const hue        = ((Math.atan2(rw, rx) / TAU + 0.5) + hueFlow * t * 0.07) % 1.0;
    const radDist    = Math.sqrt(px * px + py * py + pz * pz);
    const saturation = 0.70 + 0.30 * Math.sin(shellFrac * Math.PI);
    const lightness  = 0.22 + 0.52 * Math.exp(-radDist * 0.38);

    color.setHSL(hue, saturation, lightness);

    // ── HUD & annotations (once per frame) ──
    if (i === 0) {
        setInfo(
            "Hyperdimensional Tesseract Storm",
            "20,000 particles distributed across nested 4D hyperspheres. " +
            "Dual-plane 4D rotation (XW + YZ) with an XY twist unfolds the tesseract over time. " +
            "Stereographic projection maps the 4th axis into perceptible 3D depth. " +
            "Lorenz-inspired chaos fields breathe independently per shell."
        );
        annotate("origin", new THREE.Vector3(0, 0, 0), "4D Origin");
        annotate("xp", new THREE.Vector3(scale * 0.7,  0, 0), "+X");
        annotate("yp", new THREE.Vector3(0, scale * 0.7,  0), "+Y");
        annotate("zp", new THREE.Vector3(0, 0, scale * 0.7), "+W proj");
    }
}

// ═══════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
const clock      = new THREE.Clock();
let   frameCount = 0;
let   fpsTimer   = 0;

function animate() {
    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();

    // ── Hot particle loop ──
    for (let i = 0; i < COUNT; i++) {
        updateParticle(i, COUNT, elapsed, _target, _color);

        const b = i * 3;
        positions[b]     = _target.x;
        positions[b + 1] = _target.y;
        positions[b + 2] = _target.z;
        colors[b]        = _color.r;
        colors[b + 1]    = _color.g;
        colors[b + 2]    = _color.b;
    }

    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate    = true;

    controls.update();
    renderer.render(scene, camera);
    _updateAnnotations();

    // FPS counter
    frameCount++;
    fpsTimer += clock.getDelta();
    if (frameCount % 30 === 0) {
        const fps = Math.round(30 / Math.max(0.001, fpsTimer));
        document.getElementById('fps-val').textContent = fps;
        fpsTimer = 0;
    }
}

animate();
</script>
</body>
</html>
