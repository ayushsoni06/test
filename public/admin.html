<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Referral Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid #000;
      padding-bottom: 10px;
      margin-bottom: 48px;
      width: 100%;
      max-width: 600px;
    }

    .section { width: 100%; max-width: 600px; }

    label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      margin-top: 18px;
    }

    input[type="text"], input[type="password"], input[type="file"], select {
      width: 100%;
      border: none;
      border-bottom: 1px solid #000;
      padding: 6px 0;
      font-family: inherit;
      font-size: 0.95rem;
      background: transparent;
      outline: none;
    }

    button {
      margin-top: 28px;
      background: #000;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    button:hover { background: #333; }

    .msg {
      margin-top: 14px;
      font-size: 0.8rem;
      border-left: 2px solid #000;
      padding-left: 10px;
    }

    .divider { border: none; border-top: 1px solid #000; margin: 36px 0; }

    .note {
      font-size: 0.75rem;
      color: #555;
      margin-top: 12px;
      line-height: 1.6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 0.82rem;
    }

    th {
      text-align: left;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.7rem;
      border-bottom: 1px solid #000;
      padding: 6px 8px 6px 0;
    }

    td {
      padding: 8px 8px 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>

<h1>Admin — Referral Tracker</h1>

<div class="section">
  <label for="secret">Admin Secret</label>
  <input type="password" id="secret" placeholder="leave blank if not set" />

  <hr class="divider" />

  <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;">Upload CSV</div>

  <p class="note">
    Required columns: <strong>client_name</strong>, <strong>referee_name</strong>, <strong>amount_owed</strong><br/>
    Mode "Append" adds to existing data. Mode "Replace" overwrites everything.
  </p>

  <label for="csvFile" style="margin-top:20px;">CSV File</label>
  <input type="file" id="csvFile" accept=".csv" />

  <label for="uploadMode" style="margin-top:18px;">Upload Mode</label>
  <select id="uploadMode">
    <option value="append">Append</option>
    <option value="replace">Replace All</option>
  </select>

  <button id="uploadBtn">Upload CSV</button>
  <div id="upload-msg" class="msg" style="display:none;"></div>

  <hr class="divider" />

  <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;">Current Data</div>
  <button id="loadDataBtn" style="margin-top:16px;">Load Data</button>
  <div id="data-container" style="margin-top:16px;"></div>
</div>

<script>
  function getSecret() {
    return document.getElementById('secret').value.trim();
  }

  document.getElementById('uploadBtn').addEventListener('click', async () => {
    const file = document.getElementById('csvFile').files[0];
    const mode = document.getElementById('uploadMode').value;
    const msgEl = document.getElementById('upload-msg');

    msgEl.style.display = 'none';

    if (!file) {
      msgEl.textContent = 'Please select a CSV file.';
      msgEl.style.display = 'block';
      return;
    }

    const form = new FormData();
    form.append('csv', file);

    try {
      const res = await fetch(`/api/admin/upload?mode=${mode}`, {
        method: 'POST',
        headers: { 'x-admin-secret': getSecret() },
        body: form,
      });
      const data = await res.json();
      if (data.error) {
        msgEl.textContent = 'Error: ' + data.error;
      } else {
        msgEl.textContent = `Done. ${data.added} row(s) ${mode === 'replace' ? 'loaded (replaced all)' : 'appended'}.`;
      }
      msgEl.style.display = 'block';
    } catch (e) {
      msgEl.textContent = 'Upload failed.';
      msgEl.style.display = 'block';
    }
  });

  document.getElementById('loadDataBtn').addEventListener('click', async () => {
    const container = document.getElementById('data-container');
    try {
      const res = await fetch('/api/admin/data', {
        headers: { 'x-admin-secret': getSecret() },
      });
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        container.textContent = 'No data.';
        return;
      }

      let html = '<table><thead><tr><th>Client Name</th><th>Referee Name</th><th>Amount Owed</th></tr></thead><tbody>';
      data.forEach(r => {
        html += `<tr><td>${r.clientName}</td><td>${r.refereeName}</td><td>$${parseFloat(r.amountOwed).toFixed(2)}</td></tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    } catch (e) {
      container.textContent = 'Failed to load data.';
    }
  });
</script>
</body>
</html>
